plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Registry JDBC'
description = 'Meteor JDBC registry storage adapter.'

dependencies {
    api project(':meteor-registry')
    implementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"

    // for test
    testImplementation "com.h2database:h2:${property('lib.h2')}"
}
