plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Meteor JDBC registry storage adapter.'

dependencies {
    api project(':meteor-registry')
    implementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"

    // for test
    testImplementation "com.h2database:h2:${property('lib.h2')}"
    testRuntimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'
    testRuntimeOnly 'com.oracle.database.jdbc:ojdbc8:21.1.0.0'
    testRuntimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre8'
}
