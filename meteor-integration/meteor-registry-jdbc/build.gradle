plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Registry JDBC'
description = 'Meteor JDBC registry storage adapter.'

dependencies {
    api project(':meteor-registry')
    api "net.hasor:dbvisitor:${property('lib.dbvisitor')}"

    // for test
    testImplementation "ognl:ognl:${property('lib.ognl')}"
    testImplementation 'com.h2database:h2:2.3.232'
}