plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol Dubbo'
description = 'Dubbo binary RPC for native Dubbo 2 and 3 services over TCP and TLS.'

dependencies {
    api project(':meteor')
    api 'com.caucho:hessian:4.0.63'

    // for test
    testImplementation 'org.apache.dubbo:dubbo:3.3.6'
}
