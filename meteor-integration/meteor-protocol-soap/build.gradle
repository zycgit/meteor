plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol SOAP'
description = 'SOAP Web Services protocol adapter for ordinary Meteor Java services'

dependencies {
    api project(':meteor')
    api "jakarta.mail:jakarta.mail-api:${property('lib.jakarta.mail')}"

    // for test
    testImplementation "org.eclipse.angus:angus-mail:${property('lib.angus.mail')}"
    testImplementation "com.sun.xml.ws:jaxws-rt:${property('lib.jaxws')}"
    testImplementation "axis:axis:${property('lib.axis')}"
}
