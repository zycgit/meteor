plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Meteor Protocol SOAP'
description = 'SOAP Web Services protocol adapter for ordinary Meteor Java services'

dependencies {
    api project(':meteor')
    api 'jakarta.mail:jakarta.mail-api:2.1.5'

    // for test
    testImplementation 'org.eclipse.angus:angus-mail:2.0.5'
    testImplementation 'com.sun.xml.ws:jaxws-rt:4.0.5'
}