plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'SOAP Web Services protocol adapter for ordinary Meteor Java services'

dependencies {
    api project(':meteor')
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${property('lib.jackson')}"
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'org.eclipse.angus:angus-mail:2.0.5'

    testImplementation 'com.sun.xml.ws:jaxws-rt:4.0.5'
    testImplementation 'axis:axis:1.4'
}
