plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Meteor Protocol Hprose'
description = 'HTTP/Hprose protocol plugin and Hprose serialization'

dependencies {
    api project(':meteor')
    api 'org.hprose:hprose-java:2.0.38'
}

// Hprose 对象编解码需要访问 JDK 的流类型字段。
tasks.named('test') {
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
}