plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol gRPC'
description = 'gRPC and gRPC-Web protocol adapters for Meteor Java services'

dependencies {
    api project(':meteor')
    api 'com.google.protobuf:protobuf-java:3.25.9'
    api 'com.squareup.wire:wire-schema-jvm:4.9.11'
    api 'com.google.protobuf:protobuf-java-util:3.25.9'

    // for test
    testImplementation 'io.grpc:grpc-netty-shaded:1.84.1'
    testImplementation 'io.grpc:grpc-stub:1.84.1'
    testImplementation 'io.grpc:grpc-protobuf:1.84.1'
    testImplementation 'com.linecorp.armeria:armeria-grpc:1.42.0'
    testImplementation 'com.connectrpc:connect-kotlin-okhttp:0.5.1'
    testImplementation 'com.connectrpc:connect-kotlin-google-java-ext:0.5.1'
}

// Hprose 序列化互通场景需要访问 JDK 的流类型字段。
tasks.named('test') {
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
}
