plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol gRPC'
description = 'gRPC and gRPC-Web protocol adapters for Meteor Java services'

dependencies {
    api project(':meteor')
    api "com.google.protobuf:protobuf-java:${property('lib.protobuf')}"
    implementation "com.squareup.wire:wire-schema-jvm:${property('lib.wire')}"
    implementation "com.google.protobuf:protobuf-java-util:${property('lib.protobuf')}"

    // for test
    testImplementation "io.grpc:grpc-netty-shaded:${property('lib.grpc')}"
    testImplementation "io.grpc:grpc-stub:${property('lib.grpc')}"
    testImplementation "io.grpc:grpc-services:${property('lib.grpc')}"
    testImplementation("io.grpc:grpc-interop-testing:${property('lib.grpc')}") {
        // 互通场景不使用指标导出和 xDS CEL，避免这两项将 Protobuf 升级到不兼容的 4.x。
        exclude group: 'io.opentelemetry', module: 'opentelemetry-exporter-prometheus'
        exclude group: 'dev.cel'
    }
    testImplementation project(':meteor-protocol-hprose')
    testRuntimeOnly project(':meteor-protocol-hessian')
    testImplementation "org.hprose:hprose-java:${property('lib.hprose')}"
}

// 官方 gRPC-Web 客户端与 Chromium 仅参与互通测试。
tasks.register('prepareGrpcWebPeer', Sync) {
    from 'src/test/node/grpcweb'
    into layout.buildDirectory.dir('grpcweb-peer')
    preserve { include 'node_modules/**' }
}
tasks.register('installGrpcWebPeer', Exec) {
    dependsOn 'prepareGrpcWebPeer'
    workingDir layout.buildDirectory.dir('grpcweb-peer')
    commandLine npmCommand, 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
    inputs.files('src/test/node/grpcweb/package.json', 'src/test/node/grpcweb/package-lock.json')
    outputs.dir layout.buildDirectory.dir('grpcweb-peer/node_modules')
}
tasks.register('buildGrpcWebPeer', Exec) {
    dependsOn 'installGrpcWebPeer'
    workingDir layout.buildDirectory.dir('grpcweb-peer')
    commandLine 'node', 'build.js'
    inputs.dir('src/test/node/grpcweb')
    outputs.file layout.buildDirectory.file('grpcweb-peer/browser.bundle.js')
}
tasks.register('installGrpcWebBrowser', Exec) {
    dependsOn 'installGrpcWebPeer'
    workingDir layout.buildDirectory.dir('grpcweb-peer')
    commandLine 'node', 'node_modules/playwright/cli.js', 'install', 'chromium'
}
tasks.named('test') {
    dependsOn 'buildGrpcWebPeer', 'installGrpcWebBrowser'
    systemProperty 'grpcweb.peer.dir', layout.buildDirectory.dir('grpcweb-peer').get().asFile.absolutePath
}
