plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Registry Dubbo'
description = 'Native Apache Dubbo service registration and discovery for Meteor'

dependencies {
    api project(':meteor-protocol-dubbo')
    api 'org.apache.dubbo:dubbo:3.3.6'
    api 'org.apache.curator:curator-recipes:5.2.0'
    api platform('io.netty:netty-bom:4.2.16.Final')
    api 'io.netty:netty-handler-proxy:4.2.16.Final'
    runtimeOnly 'org.apache.curator:curator-x-discovery:5.2.0'

    // for test
    testImplementation 'org.apache.curator:curator-test:5.2.0'
}
