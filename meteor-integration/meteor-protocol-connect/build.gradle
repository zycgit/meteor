plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol Connect'
description = 'Connect RPC over HTTP and HTTPS for ordinary and Flow-based Meteor services'

dependencies {
    api project(':meteor-protocol-grpc')

    // for test
    testImplementation 'com.connectrpc:connect-kotlin-okhttp:0.5.1'
    testImplementation 'com.connectrpc:connect-kotlin-google-java-ext:0.5.1'
}
