plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Protocol XML-RPC'
description = 'XML-RPC protocol over HTTP and HTTPS'

dependencies {
    api project(':meteor')

    // for test
    testImplementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    testImplementation 'org.apache.xmlrpc:xmlrpc-server:3.1.3'
}
