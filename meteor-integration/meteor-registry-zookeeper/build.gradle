plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Registry Zookeeper'
description = 'Meteor zookeeper registry adapter.'

dependencies {
    api project(':meteor-registry')
    api 'org.apache.curator:curator-recipes:5.2.0'

    // for test
    testImplementation "ognl:ognl:${property('lib.ognl')}"
    testImplementation 'org.apache.curator:curator-test:5.2.0'
}