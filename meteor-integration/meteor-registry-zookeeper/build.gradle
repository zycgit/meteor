plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Registry Zookeeper'
description = 'Meteor zookeeper registry adapter.'

dependencies {
    api project(':meteor-registry')
    api "org.apache.curator:curator-recipes:${property('lib.curator')}"

    // for test
    testImplementation "org.apache.curator:curator-test:${property('lib.curator')}"
}
