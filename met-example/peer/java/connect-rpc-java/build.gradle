plugins {
    id 'java'
}

description = 'Community Connect RPC Java provider'

dependencies {
    implementation project(':peer:java:contracts')
    implementation 'me.ivovk:connect-rpc-java-netty:0.2.1'
    implementation 'io.grpc:grpc-protobuf:1.76.0'
    implementation 'io.grpc:grpc-stub:1.76.0'
    implementation 'com.google.protobuf:protobuf-java:4.33.1'
}
