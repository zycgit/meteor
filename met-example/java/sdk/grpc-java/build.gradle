plugins {
    id 'java'
}

description = 'gRPC-Java SDK examples'

dependencies {
    implementation project(':java:common')
    implementation "io.grpc:grpc-netty-shaded:${property('lib.grpc')}"
    implementation "io.grpc:grpc-stub:${property('lib.grpc')}"
    implementation "io.grpc:grpc-protobuf:${property('lib.grpc')}"
    implementation "com.google.protobuf:protobuf-java:${property('lib.protobuf')}"
}
