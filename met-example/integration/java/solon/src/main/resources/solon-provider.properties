# 应用身份及 RSF 监听；消费者与提供者使用不同端口。
meteor.application=solon-order-provider
meteor.unit=local
# 使用 Meteor 注册格式接入 ZooKeeper。双方的地址、root 和 unit 必须一致。
meteor.registry.provider=zookeeper
meteor.registry.address=127.0.0.1:2181
meteor.registry.root=/meteor-framework-examples
meteor.registry.publish-host=127.0.0.1
#
meteor.connectors.rsf.host=127.0.0.1
meteor.connectors.rsf.port=28870
meteor.connectors.jsonrpc.host=127.0.0.1
meteor.connectors.jsonrpc.port=28872
meteor.connectors.jsonrpc.context=/jsonrpc
meteor.connectors.hessian.host=127.0.0.1
meteor.connectors.hessian.port=28872
meteor.connectors.hessian.context=/hessian