plugins {
    id 'base'
}

description = 'Meteor getting-started examples by language and role'

// 示例独立维护 SDK 依赖，Meteor 版本与仓库保持一致。
def meteorProperties = new Properties()
file('../gradle.properties').withInputStream { meteorProperties.load(it) }
ext.hasorVersion = meteorProperties.getProperty('lib.hasor')

allprojects {
    group = 'net.hasor.example'
    version = meteorProperties.getProperty('version')
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(17)
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 17
        }
    }
}
