plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'HTTP/Hprose protocol plugin and Hprose serialization'

dependencies {
    api project(':rsf-framework')
    api "org.hprose:hprose-java:${property('lib.hprose')}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${property('lib.jackson')}"

    testRuntimeOnly "org.slf4j:slf4j-simple:${property('lib.slf4j')}"
}

// Hprose bean decoding reflects into java.io on Java 17.
tasks.named('test') {
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
}
