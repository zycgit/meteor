# Hasor Boot 仅扫描本示例；由角色入口显式绑定实现或消费者。
hasor.loadPackages=net.hasor.meteor.example
hasor.boot.web.connectors.http.enabled=false
meteor.application=example-consumer
meteor.unit=default
meteor.default-protocol=rsf
meteor.default-timeout=5000
meteor.connect-timeout=3000

# 复用 RegistryMain 启动的 H2 注册存储。
example.jdbc.url=jdbc:h2:tcp://127.0.0.1:19192/mem:console-debug
example.jdbc.username=sa
example.jdbc.password=
meteor.registry.provider=jdbc
meteor.registry.data-source=registryDataSource
meteor.registry.publish-host=127.0.0.1
meteor.registry.management-token=console-debug
meteor.registry.management-protocols=rsf
meteor.registry.refresh-millis=500

# 消费者默认只启用 RSF；地址本按已启用的连接器筛选实际调用地址。
meteor.connectors.rsf.host=127.0.0.1
meteor.connectors.rsf.port=19400
