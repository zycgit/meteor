# HTTP 控制台；关闭后仍可运行注册中心管理 RPC。
hasor.boot.web.connectors.http.enabled=true
hasor.boot.web.connectors.http.host=127.0.0.1
hasor.boot.web.connectors.http.port=8080
data.directory=build/runtime/console
meteor.unit=default
# 管理连接空闲寿命，单位毫秒；每秒检查一次。
commands.context.ttl=300000
session.secureCookie=false
security.enable=false
# 开启登录时设置账号密码，也可通过环境变量提供密码。
security.account=admin:${METEOR_CONSOLE_PASSWORD}

# 填写 storage.address 后启用注册中心管理 RPC；存储表或命名空间需预先准备。
rpc.host=127.0.0.1
rpc.port=19193
rpc.unit=default
# 也可通过 METEOR_REGISTRY_MANAGEMENT_TOKEN 环境变量提供管理凭据。
management.token=
storage.type=jdbc
storage.database=h2
storage.address=
storage.username=sa
storage.password=
# Nacos 可配置 storage.namespace、storage.group；ZooKeeper 可配置 storage.root。
# 级联时用 storage.type=remote、storage.address=对端 RPC 地址，并填写对端凭据。
storage.managementToken=
