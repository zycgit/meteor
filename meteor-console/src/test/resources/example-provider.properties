# Hasor Boot 仅扫描本示例；由角色入口显式绑定实现或消费者。
hasor.loadPackages=net.hasor.meteor.example
hasor.boot.web.connectors.http.enabled=false
meteor.application=example-provider
meteor.unit=default
meteor.default-protocol=rsf
meteor.default-timeout=5000
meteor.connect-timeout=3000

# 复用 RegistryMain 启动的 H2 注册存储。
example.jdbc.url=jdbc:h2:tcp://127.0.0.1:19192/mem:console-debug
example.jdbc.username=sa
example.jdbc.password=
meteor.registry.provider=jdbc
meteor.registry.data-source=registryDataSource
meteor.registry.publish-host=127.0.0.1
meteor.registry.management-token=console-debug
meteor.registry.management-protocols=rsf
meteor.registry.refresh-millis=500

# 各协议端口直接列出，提供者与消费者互不占用；按需删除对应协议即可禁用。
meteor.connectors.rsf.host=127.0.0.1
meteor.connectors.rsf.port=19200

meteor.connectors.dubbo.host=127.0.0.1
meteor.connectors.dubbo.port=19201

meteor.connectors.thrift.host=127.0.0.1
meteor.connectors.thrift.port=19202
meteor.connectors.thrift.options.multiplexed=true

meteor.connectors.oncrpc.host=127.0.0.1
meteor.connectors.oncrpc.port=19203

meteor.connectors.hprose.host=127.0.0.1
meteor.connectors.hprose.port=19204
meteor.connectors.hprose.context=/hprose

meteor.connectors.jsonrpc.host=127.0.0.1
meteor.connectors.jsonrpc.port=19206
meteor.connectors.jsonrpc.context=/jsonrpc

meteor.connectors.xmlrpc.host=127.0.0.1
meteor.connectors.xmlrpc.port=19207
meteor.connectors.xmlrpc.context=/xmlrpc

meteor.connectors.hessian.host=127.0.0.1
meteor.connectors.hessian.port=19208
meteor.connectors.hessian.context=/hessian
