name: ${METEOR_TEST_PROJECT:?Launch this file through run.sh or run.ps1}

services:
  runner:
    container_name: ${METEOR_TEST_PROJECT:?}-runner
    image: ${METEOR_TEST_IMAGE_RUNNER:?}
    platform: ${METEOR_TEST_PLATFORM:?}
    working_dir: /workspace/meteor
    entrypoint: ["/bin/bash", "/workspace/meteor/meteor-test/docker/runner.sh"]
    command: [":meteor-test:test", "--no-daemon", "--console=plain", "--rerun-tasks"]
    init: true
    environment:
      METEOR_TEST_RUN_ID: ${METEOR_TEST_RUN_ID:?}
      METEOR_TEST_PLATFORM: ${METEOR_TEST_PLATFORM:?}
      METEOR_TEST_RUNNER_HOST: runner.meteor.test
      METEOR_TEST_NETWORK: ${METEOR_TEST_NETWORK:?}
      METEOR_TEST_WORKSPACE_VOLUME: ${METEOR_TEST_WORKSPACE_VOLUME:?}
      METEOR_TEST_GRADLE_VOLUME: ${METEOR_TEST_GRADLE_VOLUME:?}
      METEOR_TEST_MAVEN_VOLUME: ${METEOR_TEST_MAVEN_VOLUME:?}
      METEOR_TEST_EVIDENCE_DIR: /workspace/meteor/meteor-test/build/docker-evidence/${METEOR_TEST_RUN_ID:?}
      METEOR_TEST_IMAGE_JAVA: ${METEOR_TEST_IMAGE_JAVA:?}
      METEOR_TEST_IMAGE_PYTHON: ${METEOR_TEST_IMAGE_PYTHON:?}
      METEOR_TEST_IMAGE_NODE: ${METEOR_TEST_IMAGE_NODE:?}
      METEOR_TEST_IMAGE_NATIVE: ${METEOR_TEST_IMAGE_NATIVE:?}
      METEOR_TEST_IMAGE_GO: ${METEOR_TEST_IMAGE_GO:?}
      METEOR_TEST_IMAGE_BROWSER: ${METEOR_TEST_IMAGE_BROWSER:?}
      METEOR_TEST_IMAGE_ENVOY: ${METEOR_TEST_IMAGE_ENVOY:?}
      METEOR_TEST_IMAGE_NACOS: ${METEOR_TEST_IMAGE_NACOS:?}
      METEOR_TEST_IMAGE_ZOOKEEPER: ${METEOR_TEST_IMAGE_ZOOKEEPER:?}
      METEOR_TEST_IMAGE_H2: ${METEOR_TEST_IMAGE_H2:?}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/workspace/meteor/meteor-test/build/container-tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace:/workspace
      - gradle:/root/.gradle
      - maven:/root/.m2
    networks:
      test:
        aliases: [runner.meteor.test]
    labels:
      net.hasor.meteor.test.run: ${METEOR_TEST_RUN_ID:?}
      net.hasor.meteor.test.role: runner

volumes:
  workspace:
    name: ${METEOR_TEST_WORKSPACE_VOLUME:?}
    labels:
      net.hasor.meteor.test.run: ${METEOR_TEST_RUN_ID:?}
  gradle:
    name: ${METEOR_TEST_GRADLE_VOLUME:?}
    external: true
  maven:
    name: ${METEOR_TEST_MAVEN_VOLUME:?}
    external: true

networks:
  test:
    name: ${METEOR_TEST_NETWORK:?}
    enable_ipv6: true
    labels:
      net.hasor.meteor.test.run: ${METEOR_TEST_RUN_ID:?}
