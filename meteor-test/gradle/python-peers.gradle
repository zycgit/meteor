def pythonGrpcEnvironment = layout.buildDirectory.dir('python-grpc-venv')
def pythonGrpcGenerated = layout.buildDirectory.dir('python-grpc-generated')
def pythonGrpcExecutable = pythonGrpcEnvironment.map { directory ->
    def relative = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'Scripts/python.exe' : 'bin/python'
    directory.file(relative).asFile
}

// 官方 SDK 与生成工具仅装入测试构建目录，契约直接复用用户示例。
tasks.register('preparePythonGrpcPeer', Exec) {
    def proto = rootProject.file('met-example/src/main/resources/proto/order.proto')
    inputs.files('src/test/python/grpc/prepare.py', 'src/test/python/grpc/requirements.txt', proto)
    outputs.files(pythonGrpcExecutable,
            pythonGrpcGenerated.map { it.file('order_pb2.py') },
            pythonGrpcGenerated.map { it.file('order_pb2_grpc.py') },
            pythonGrpcGenerated.map { it.file('requirements-installed.txt') })
    commandLine 'python3', file('src/test/python/grpc/prepare.py'),
            '--environment', pythonGrpcEnvironment.get().asFile,
            '--generated', pythonGrpcGenerated.get().asFile, '--proto', proto
}

tasks.named('test') {
    dependsOn 'preparePythonGrpcPeer'
    systemProperty 'python.grpc.executable', pythonGrpcExecutable.get().absolutePath
    systemProperty 'python.grpc.script', file('src/test/python/grpc/peer.py').absolutePath
    systemProperty 'python.grpc.generated', pythonGrpcGenerated.get().asFile.absolutePath
    systemProperty 'python.grpc.logs', layout.buildDirectory.dir('python-grpc-peer-logs').get().asFile.absolutePath
}

// Python 标准库 XML-RPC 对端无需安装额外依赖。
tasks.named('test') {
    systemProperty 'xmlrpc.peer.script', file('src/test/python/xmlrpc/peer.py').absolutePath
}

// Apache Thrift Python SDK 仅安装在根构建目录，生成源码由官方编译器从共享 IDL 生成后提交。
def pythonThriftEnvironment = rootProject.layout.buildDirectory.dir('python-thrift-venv')
def pythonThriftExecutable = pythonThriftEnvironment.map { directory ->
    def relative = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'Scripts/python.exe' : 'bin/python'
    directory.file(relative).asFile
}

tasks.register('preparePythonThriftPeer', Exec) {
    inputs.files('src/test/python/thrift/prepare.py', 'src/test/python/thrift/requirements.txt')
    outputs.files(pythonThriftExecutable,
            pythonThriftEnvironment.map { it.file('requirements-installed.txt') })
    commandLine 'python3', file('src/test/python/thrift/prepare.py'),
            '--environment', pythonThriftEnvironment.get().asFile
}

tasks.named('test') {
    dependsOn 'preparePythonThriftPeer'
    systemProperty 'python.thrift.executable', pythonThriftExecutable.get().absolutePath
    systemProperty 'python.thrift.script', file('src/test/python/thrift/peer.py').absolutePath
    systemProperty 'python.thrift.logs', layout.buildDirectory.dir('python-thrift-peer-logs').get().asFile.absolutePath
}

// SOAP Python 两端分别使用 Zeep 与 soapfish2；WSDL 由提供者 SDK 自动生成。
def pythonSoapEnvironment = layout.buildDirectory.dir('python-soap-venv')
def pythonSoapGenerated = layout.buildDirectory.dir('python-soap-generated')
def pythonSoapExecutable = pythonSoapEnvironment.map { directory ->
    def relative = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'Scripts/python.exe' : 'bin/python'
    directory.file(relative).asFile
}

tasks.register('preparePythonSoapPeer', Exec) {
    inputs.files('src/test/python/soap/prepare.py', 'src/test/python/soap/peer.py',
            'src/test/python/soap/requirements.txt')
    outputs.files(pythonSoapExecutable, pythonSoapGenerated.map { it.file('orders.wsdl') },
            pythonSoapGenerated.map { it.file('requirements-installed.txt') })
    commandLine 'python3', file('src/test/python/soap/prepare.py'),
            '--environment', pythonSoapEnvironment.get().asFile,
            '--generated', pythonSoapGenerated.get().asFile
}

tasks.named('test') {
    dependsOn 'preparePythonSoapPeer'
    systemProperty 'python.soap.executable', pythonSoapExecutable.get().absolutePath
    systemProperty 'python.soap.script', file('src/test/python/soap/peer.py').absolutePath
    systemProperty 'python.soap.contract', pythonSoapGenerated.get().file('orders.wsdl').asFile.absolutePath
    systemProperty 'python.soap.logs', layout.buildDirectory.dir('python-soap-peer-logs').get().asFile.absolutePath
}
