import groovy.json.JsonOutput
import groovy.xml.XmlSlurper

// 每次执行独立归档，筛选运行和复用旧结果都会明确记录。
def runId = new Date().format('yyyyMMdd-HHmmss-SSS', TimeZone.getTimeZone('Asia/Shanghai'))
def runDirectory = layout.buildDirectory.dir("interoperability/${runId}")
def testTask = tasks.named('test')
def resultsDirectory = layout.buildDirectory.dir('test-results/test')
Long testStartedAt = null
int previousResultFileCount = 0
def containerEvidenceDirectory = providers.environmentVariable('METEOR_TEST_EVIDENCE_DIR')
def containerEnvironment = System.getenv().findAll { key, value ->
    key.startsWith('METEOR_TEST_IMAGE_') || key in [
        'METEOR_TEST_NETWORK', 'METEOR_TEST_PLATFORM', 'METEOR_TEST_RUN_ID',
        'METEOR_TEST_HOST_PLATFORM', 'METEOR_TEST_RUNNER_HOST'
    ]
}.sort()

testTask.configure {
    systemProperty 'meteor.test.runDirectory', runDirectory.get().asFile.absolutePath
    inputs.property 'containerEnvironment', containerEnvironment
    doFirst {
        // 本轮只读取清理之后新生成的 XML，不依赖可回退的系统时间或文件时间。
        def previousFiles = fileTree(resultsDirectory).matching { include 'TEST-*.xml' }.files
        previousResultFileCount = previousFiles.size()
        delete previousFiles
        testStartedAt = System.currentTimeMillis()
        def directory = runDirectory.get().asFile
        directory.mkdirs()
        def selection = System.properties.findAll { key, value -> key.toString().startsWith('meteor.matrix.') }
        def versions = rootProject.properties.findAll { key, value -> key.toString().startsWith('lib.') }
        def context = [
            runId: runId,
            testStartedAt: testStartedAt,
            includes: filter.commandLineIncludePatterns.toList().sort(),
            matrixSelection: selection,
            nacosClientLimitTime: systemProperties['limitTime'],
            libraryVersions: versions,
            executionPlatform: [
                os: System.getProperty('os.name'),
                architecture: System.getProperty('os.arch'),
                javaVersion: System.getProperty('java.version')
            ],
            containerRuntime: [
                configured: containerEnvironment.containsKey('METEOR_TEST_NETWORK'),
                environment: containerEnvironment
            ]
        ]
        new File(directory, 'configuration.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(context)) + '\n'
    }
}

def report = tasks.register('interoperabilityReport') {
    group = 'verification'
    description = 'Archive JUnit cases, selected scope and outcomes from this interoperability run.'
    doLast {
        def directory = runDirectory.get().asFile
        directory.mkdirs()
        def cases = []
        def results = resultsDirectory.get().asFile
        def test = testTask.get()
        def resultFiles = fileTree(results).matching { include 'TEST-*.xml' }.files.sort()
        def currentFiles = []
        def excludedPreviousResultFiles = resultFiles.size()
        if (test.state.upToDate) {
            currentFiles = resultFiles
            excludedPreviousResultFiles = 0
        } else if (testStartedAt != null) {
            currentFiles = resultFiles
            excludedPreviousResultFiles = previousResultFileCount
        }

        // 启动前失败时排除现存旧 XML；启动后只读本轮文件，缓存复用单独标明。
        currentFiles.each { result ->
            def suite = new XmlSlurper(false, false).parse(result)
            suite.testcase.each { testcase ->
                def status = 'passed'
                if (testcase.failure.size() > 0 || testcase.error.size() > 0) {
                    status = 'failed'
                } else if (testcase.skipped.size() > 0) {
                    status = 'skipped'
                }
                def entry = [
                    caseId: testcase.@classname.text() + '#' + testcase.@name.text(),
                    className: testcase.@classname.text(),
                    scenario: testcase.@name.text(),
                    seconds: testcase.@time.text(),
                    status: status
                ]
                if (status == 'failed') {
                    entry.failure = testcase.failure.text() + testcase.error.text()
                }
                cases.add(entry)
            }
        }
        copy {
            from currentFiles
            into new File(directory, 'test-results')
        }

        // 启动器记录宿主与镜像信息，对端记录网络、命令和容器生命周期。
        def containerEvidence = containerEvidenceDirectory.orNull
        boolean evidenceAvailable = false
        if (containerEvidence != null) {
            def source = file(containerEvidence)
            evidenceAvailable = source.isDirectory()
            if (evidenceAvailable) {
                copy {
                    from source
                    into new File(directory, 'docker-evidence')
                }
            }
        }

        // 一份清单对应实际执行的 JUnit 实例，保留完整参数名称以追踪发现方式与调用方向。
        new File(directory, 'selected-cases.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(cases)) + '\n'
        def summary = [
            runId: runId,
            tests: cases.size(),
            passed: cases.count { it.status == 'passed' },
            failed: cases.count { it.status == 'failed' },
            skipped: cases.count { it.status == 'skipped' },
            testTaskStarted: testStartedAt != null,
            excludedPreviousResultFiles: excludedPreviousResultFiles,
            resultsAvailable: !currentFiles.isEmpty(),
            reusedResults: test.state.upToDate,
            containerEvidenceAvailable: evidenceAvailable,
            taskFailure: test.state.failure?.message,
            includes: test.filter.commandLineIncludePatterns.toList().sort()
        ]
        new File(directory, 'summary.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(summary)) + '\n'
        logger.lifecycle("Interoperability results: ${directory}")
    }
}

testTask.configure {
    finalizedBy report
}
