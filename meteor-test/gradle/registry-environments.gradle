// 存储客户端留在测试 JVM，注册中心服务由容器提供。
dependencies {
    testImplementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"
    testImplementation "com.h2database:h2:${property('lib.h2')}"
    testImplementation "org.apache.curator:curator-test:${property('lib.curator')}"
}

tasks.named('test') {
    // 功能矩阵放宽 SDK 对重复配置读取的本地节流；默认 5 QPS 的冒烟可通过参数单独执行。
    systemProperty 'limitTime', System.getProperty('meteor.test.nacos.limitTime', '1000')

    // 独立业务 JVM 仅加载示例 main runtime，外语调用复用对用户发布的脚本。
    def exampleProject = project(':met-example')
    systemProperty 'meteor.example.mainClasspath', exampleProject.sourceSets.main.runtimeClasspath.asPath
    systemProperty 'meteor.example.clientsDirectory', exampleProject.file('src/main/clients').absolutePath
}
