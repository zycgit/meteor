syntax = "proto3";
package web;

message Message {
  string value = 7;
  int32 count = 2;
}

service Echo {
  rpc echo(Message) returns (Message);
  rpc list(Message) returns (stream Message);
  rpc fail(Message) returns (Message);
  rpc broken(Message) returns (stream Message);
}
