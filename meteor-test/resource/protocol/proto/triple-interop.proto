syntax = "proto3";
package net.hasor.peer.protocol.triple;
import "google/protobuf/wrappers.proto";
service DubboProtoService {
  rpc echo(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc fail(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc metadata(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc slow(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc count(google.protobuf.StringValue) returns (stream google.protobuf.StringValue);
  rpc collect(stream google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc chat(stream google.protobuf.StringValue) returns (stream google.protobuf.StringValue);
}
