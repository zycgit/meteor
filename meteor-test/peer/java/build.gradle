    'apache-axis', 'apache-dubbo', 'apache-thrift', 'hprose-java', 'metro-jaxws',
    'jsonrpc4j', 'apache-xmlrpc', 'caucho-hessian', 'grpc-java', 'connect-kotlin', 'remotetea'
]
peerImplementations.each { implementation ->
    sourceSets.main.java.srcDir("${implementation}/src/main/java")
}

