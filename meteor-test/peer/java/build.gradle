// SDK 名称对应实际实现；同一实现的历史 profile 继续复用相同的 Main 编译结果。
def sdkNames = [
    'axis:axis': 'Apache Axis',
    'org.apache.dubbo:dubbo': 'Apache Dubbo', 'com.alibaba:dubbo': 'Alibaba Dubbo',
    'org.apache.thrift:libthrift': 'Apache Thrift', 'org.hprose:hprose-java': 'Hprose Java',
    'com.sun.xml.ws:jaxws-rt': 'Metro JAX-WS', 'com.github.briandilley.jsonrpc4j:jsonrpc4j': 'jsonrpc4j',
    'org.apache.xmlrpc:xmlrpc-client': 'Apache XML-RPC', 'com.caucho:hessian': 'Caucho Hessian',
    'io.grpc:grpc-netty-shaded': 'gRPC-Java', 'com.connectrpc:connect-kotlin-okhttp': 'Connect Kotlin',
    'me.ivovk:connect-rpc-java-netty': 'Connect RPC Java', 'org.acplt.remotetea:remotetea-oncrpc': 'RemoteTea'
]
def isolatedProjects = [
    connectServer: ':meteor-test-sdk:connect-rpc-java-0.2',
    connectCurrent: ':meteor-test-sdk:connect-kotlin-0.10',
    dubboClassic: ':meteor-test-sdk:alibaba-dubbo-2.6',
    soapJavax: ':meteor-test-sdk:metro-jaxws-2.3',
    thriftClassic: ':meteor-test-sdk:apache-thrift-0.10',
    thriftPreLayered: ':meteor-test-sdk:apache-thrift-0.10'
]
def profileNotes = [
    dubboTls: "原厂 Apache Dubbo 3.3.6 + Netty 4.1.113.Final + JDK 17 TLS；" +
              '该 Netty 版本默认不校验证书主机名，此组合验证证书链及双向认证，不表示支持主机名校验。',
    hessianLegacy: 'JDK 17 运行该 SDK 需要在独立 JVM 开放 java.lang 反射访问。',
]
def currentCompileProfiles = [
    'axis', 'dubbo', 'thrift', 'hprose', 'soap', 'jsonrpc', 'xmlrpc', 'hessian', 'grpc', 'connect', 'oncrpc'
]

def jacksonDependency = "com.fasterxml.jackson.core:jackson-databind:${property('lib.jackson')}"
def sdkRuntimes = sdkCoordinates.collectEntries { sdk, coordinates ->
    def runtime = configurations.create("${sdk}PeerRuntime") {
        canBeConsumed = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
    // 控制数据的 JSON 编码只加入各自 profile，不借用 Meteor 或驱动依赖。
    if (sdk != 'axis') {
        dependencies.add(runtime.name, jacksonDependency)
    }
    coordinates.each { coordinate ->
        // TLS 固定组合只替换该 profile 的 Netty 依赖，普通 Dubbo 与 Triple 保持原运行图。
        if (sdk == 'dubboTls' && coordinate.startsWith('org.apache.dubbo:dubbo:')) {
            dependencies.add(runtime.name, coordinate) {
                exclude group: 'io.netty'
            }
        } else {
            dependencies.add(runtime.name, coordinate)
        }
    }
    [(sdk): runtime]
}

dependencies {
    compileOnly project(':meteor-test-contracts')
    compileOnly jacksonDependency
    sdkCoordinates.each { sdk, coordinates ->
        // 旧版 SDK 只在各自运行图中使用；Connect 服务端由独立标准 main 编译。
        if (sdk in currentCompileProfiles) {
            coordinates.each { coordinate -> compileOnly coordinate }
        }
    }
}

tasks.named('compileJava') {
    options.compilerArgs += '-parameters'
}

// 协议、角色和业务契约归各 SDK 的 nxn.json；这里只导出真实运行依赖。
tasks.register('exportRuntimes') {
    description = 'Export the isolated classpath of every official Java SDK execution profile.'
    dependsOn tasks.named('classes')
    dependsOn ':meteor-test-contracts:classes'
    dependsOn isolatedProjects.values().toList().unique().collect { "${it}:classes" }
    inputs.files(sdkRuntimes.values())
    inputs.files(sourceSets.main.output)
    inputs.files { project(':meteor-test-contracts').sourceSets.main.output }
    inputs.files { isolatedProjects.values().toList().unique().collect { project(it).sourceSets.main.output } }
    inputs.property('sdkCoordinates', sdkCoordinates)
    inputs.property('profileNotes', profileNotes)
    def destination = layout.buildDirectory.file('execution/runtimes.json')
    outputs.file(destination)

    doLast {
        // 每个运行图只包含所属标准 main、共享契约以及该 SDK 的独立依赖。
        def contractsOutput = project(':meteor-test-contracts').sourceSets.main.output
        def profiles = sdkRuntimes.collectEntries { sdk, runtime ->
            def peerProject = isolatedProjects[sdk]
            def peerOutput = sourceSets.main.output
            if (peerProject != null) {
                peerOutput = project(peerProject).sourceSets.main.output
            }
            def classpath = files(peerOutput, contractsOutput, runtime).files
                    .findAll { it.exists() }
                    .collect { it.absolutePath }
            // 使用已解析的组件记录版本，不将声明版本误当成实际运行版本。
            def components = runtime.incoming.resolutionResult.allComponents
                    .findAll { it.id instanceof ModuleComponentIdentifier }
                    .collect { component ->
                        def id = component.id
                        [group: id.group, module: id.module, version: id.version]
                    }
                    .sort { component -> "${component.group}:${component.module}" }
            def primary = sdkCoordinates[sdk][0].split(':')
            def selected = components.find { component ->
                component.group == primary[0] && component.module == primary[1]
            }
            if (selected == null || selected.version != primary[2]) {
                throw new GradleException("SDK profile ${sdk} requires ${sdkCoordinates[sdk][0]}, resolved ${selected}")
            }
            if (sdk == 'dubboTls') {
                def nettyCoordinate = sdkCoordinates.dubboTls.find { it.startsWith('io.netty:netty-all:') }
                def nettyVersion = nettyCoordinate.split(':')[2]
                def nettyComponents = components.findAll { component -> component.group == 'io.netty' }
                def nettyMismatch = nettyComponents.findAll { component -> component.version != nettyVersion }
                if (nettyComponents.isEmpty() || !nettyMismatch.isEmpty()) {
                    throw new GradleException("SDK profile dubboTls requires uniform Netty ${nettyVersion}: " +
                                              "${nettyComponents}")
                }
            }
            def metadata = [classpath: classpath, sdk: sdkNames[primary[0] + ':' + primary[1]],
                            version: selected.version, components: components]
            if (profileNotes[sdk] != null) {
                metadata.notes = profileNotes[sdk]
            }
            [(sdk): metadata]
        }

        def file = destination.get().asFile
        file.parentFile.mkdirs()
        def manifest = [profiles: profiles]
        file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

// SDK 工程自行导出版本和依赖；使用方只接收清单位置。
ext.nxnRuntimeProperties = [
        'meteor.test.sdk.manifest': files(tasks.named('exportRuntimes'))
]
