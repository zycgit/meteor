import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// 文件路径始终以共享测试根目录为基准，不随 Java 子工程目录改变。
ext.executionProperties = {
    def testDirectory = rootProject.file('meteor-test')
    def outputDirectory = layout.buildDirectory.get().asFile
    def certificateDirectory = new File(testDirectory, 'resource/certs/acceptance')
    def sdkManifest = project(':meteor-test-sdk').layout.buildDirectory.file('execution/runtimes.json').get().asFile
    def sdkExecution = new JsonSlurper().parse(sdkManifest)
    def profiles = sdkExecution.profiles
    def classpaths = profiles.collectEntries { name, profile ->
        [(name): profile.classpath.join(File.pathSeparator)]
    }
    def properties = new LinkedHashMap<String, Object>()
    properties['meteor.test.sdk.compatibility'] = JsonOutput.toJson(sdkExecution.compatibility)
    classpaths.each { name, classpath -> properties["meteor.test.sdk.profile.${name}.classpath"] = classpath }
    def protocols = ['dubbo', 'thrift', 'hprose', 'soap', 'jsonrpc', 'xmlrpc', 'hessian', 'grpc', 'oncrpc']
    protocols.each { name -> properties["meteor.test.sdk.${name}.classpath"] = classpaths[name] }
    properties.putAll([
        'meteor.test.sdk.grpcweb.classpath': classpaths.connect,
        'meteor.test.sdk.connect.classpath': classpaths.connect,
        'meteor.test.sdk.connect.providerClasspath': classpaths.connectServer,
        'meteor.test.sdk.triple.classpath': classpaths.tripleLegacy,
        'triple.peer.classpath': classpaths.dubbo,
        'triple.peer.legacy.classpath': classpaths.tripleLegacy,
        'hessian.peer.classpath': classpaths.hessian,
        'hprose.java.peer.classpath': classpaths.hprose,
        'rsf.java.peer.classpath': classpaths.rsf,
        'soap.metro.peer.classpath': classpaths.soap,
        'soap.axis.peer.classpath': classpaths.axis,
        'thrift.peer.classpath': classpaths.thrift,
        'jsonrpc.java.peer.classpath': classpaths.jsonrpc,
        'xmlrpc.java.peer.classpath': classpaths.xmlrpc,
        'oncrpc.java.peer.classpath': classpaths.oncrpc,
        'connect.java.peer.classpath': classpaths.connect,
        'connect.java.server.peer.classpath': classpaths.connectServer,
        'dubbo.peer.classpath': classpaths.dubbo,
        'dubbo.peer.tls.classpath': classpaths.dubboTls,
        'dubbo.peer.legacy.classpath': classpaths.dubboLegacy
    ])

    // 应用进程只使用标准 main 输出，不借用 JUnit 或官方 SDK 的运行依赖。
    properties['meteor.test.application.classpath'] = sourceSets.main.runtimeClasspath.asPath
    properties['meteor.test.container.javaClasspath'] = sourceSets.main.runtimeClasspath.asPath
    properties['meteor.test.peerDirectory'] = new File(testDirectory, 'peer').absolutePath
    properties['limitTime'] = System.getProperty('meteor.test.nacos.limitTime', '1000')
    properties['soap.peer.tls.directory'] = certificateDirectory.absolutePath
    properties['go.order.peer.cert-dir'] = certificateDirectory.absolutePath

    // 常驻容器持有语言工具链；场景输入仍挂载自同一份测试工作区。
    properties.putAll([
        'hprose.peer.dir': '/opt/meteor-peer/node/hprose',
        'grpcweb.peer.dir': '/opt/meteor-peer/node/grpcweb',
        'connect.peer.dir': '/opt/meteor-peer/node/connect',
        'jsonrpc.peer.dir': '/opt/meteor-peer/node/jsonrpc',
        'python.grpc.executable': '/opt/meteor-peer/python-grpc/bin/python',
        'python.grpc.generated': '/opt/meteor-peer/python-grpc-generated',
        'python.thrift.executable': '/opt/meteor-peer/python-thrift/bin/python',
        'python.soap.executable': '/opt/meteor-peer/python-soap/bin/python',
        'python.soap.contract': '/opt/meteor-peer/python-soap-generated/orders.wsdl',
        'oncrpc.peer.executable': '/opt/meteor-peer/native/oncrpc_peer',
        'oncrpc.rpcbind.peer.executable': '/opt/meteor-peer/native/oncrpc_rpcbind_peer',
        'go.order.peer.binary': '/opt/meteor-peer/go/order-peer'
    ])
    ['grpc', 'thrift', 'soap'].each { name ->
        properties["python.${name}.script"] = new File(testDirectory, "peer/python/${name}/peer.py").absolutePath
    }
    properties['xmlrpc.peer.script'] = new File(testDirectory, 'peer/python/xmlrpc/peer.py').absolutePath

    // 编排器会为每组覆盖这些产物目录，标准 Gradle 运行则写当前 Java 工程 build。
    def outputPaths = [
        'dubbo.peer.output.directory': 'peer-logs',
        'hessian.peer.output.directory': 'hessian-peer-logs',
        'soap.peer.output.directory': 'soap-peer-logs',
        'thrift.peer.output.directory': 'thrift-peer-logs',
        'java.peer.output.directory': 'java-peer-logs',
        'meteor.test.sdk.logDirectory': 'sdk-peer-logs',
        'python.grpc.logs': 'python-grpc-peer-logs',
        'python.thrift.logs': 'python-thrift-peer-logs',
        'python.soap.logs': 'python-soap-peer-logs',
        'oncrpc.peer.usage.file': 'oncrpc-native-process-usage.jsonl',
        'oncrpc.peer.output.directory': 'oncrpc-peer-logs',
        'go.order.peer.work-dir': 'go-peer/runs',
        'meteor.test.container.workDirectory': 'container-scenarios'
    ]
    outputPaths.each { name, relative -> properties[name] = new File(outputDirectory, relative).absolutePath }
    System.properties.findAll { key, value -> key.toString().startsWith('meteor.matrix.') }.each { key, value ->
        properties[key.toString()] = value.toString()
    }
    // 与标准 Gradle 报告保留相同的依赖版本审计；不导出凭据或整个项目属性。
    rootProject.properties.findAll { key, value -> key.toString().startsWith('lib.') }.each { key, value ->
        properties[key.toString()] = value.toString()
    }
    properties
}
