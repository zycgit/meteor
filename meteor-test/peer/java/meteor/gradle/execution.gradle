import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.file.FileCollection
import org.gradle.api.provider.Provider

// 各测试工程自行声明运行配置；延迟收集，保留 FileCollection 携带的构建依赖。
def runtimeProperties = providers.provider {
    def properties = new LinkedHashMap<String, Object>()
    rootProject.subprojects.findAll { it.ext.has('nxnRuntimeProperties') }.each { peer ->
        peer.nxnRuntimeProperties.each { name, value ->
            if (properties.putIfAbsent(name, value) != null) {
                throw new GradleException("Duplicate NXN runtime property: ${name}")
            }
        }
    }
    properties
}
def runtimeFiles = files(runtimeProperties.map { it.values().findAll { it instanceof FileCollection } })
def runtimeFile = layout.buildDirectory.file('execution/runtime.json')
def testDirectory = rootProject.file('meteor-test')

tasks.register('exportExecution', JavaExec) {
    description = 'Export compiled tests and the runtime declarations of their peer projects.'
    dependsOn tasks.named('testClasses'), runtimeFiles
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hasor.meteor.test.nxn.NxnMain'
    workingDir testDirectory
    outputs.file(runtimeFile)
    outputs.upToDateWhen { false }
    doFirst {
        def properties = runtimeProperties.get().collectEntries { name, value ->
            def resolved = value
            if (resolved instanceof Provider) {
                resolved = resolved.get()
            }
            if (resolved instanceof FileCollection) {
                if (name.endsWith('.classpath')) {
                    // Java 插件会列出没有资源时不存在的输出目录；JAR 仍保留，缺制品由计划严格报错。
                    resolved = resolved.filter { it.exists() || it.name.endsWith('.jar') }
                }
                resolved = resolved.asPath
            }
            [(name): resolved]
        }
        // 仅转发矩阵选项与公开依赖版本，不导出整个 Gradle 属性集合。
        System.properties.each { name, value ->
            if (name.toString().startsWith('meteor.matrix.')) {
                properties[name.toString()] = value.toString()
            }
        }
        rootProject.properties.each { name, value ->
            if (name.toString().startsWith('lib.')) {
                properties[name.toString()] = value.toString()
            }
        }
        def seed = [classpath: sourceSets.test.runtimeClasspath.files.findAll { it.exists() }*.absolutePath,
                    classDirectories: sourceSets.test.output.classesDirs.files*.absolutePath,
                    jvmArguments: tasks.named('test').get().jvmArgs,
                    systemProperties: properties, workingDirectory: testDirectory.absolutePath]
        def input = layout.buildDirectory.file('execution/inputs.json').get().asFile
        input.parentFile.mkdirs()
        input.setText(JsonOutput.toJson(seed), 'UTF-8')
        setArgs(['export', input.absolutePath, runtimeFile.get().asFile.absolutePath])
    }
}

tasks.named('test') {
    dependsOn tasks.named('exportExecution')
    workingDir testDirectory
    maxHeapSize = '1536m'
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    doFirst {
        // 根构建隔离当前 JVM；子进程沿用同一组 HOME、临时目录和调用方 JVM 选项。
        def homeDirectory = layout.buildDirectory.dir("test-work/${name}/home").get().asFile.absolutePath
        def temporaryDirectory = layout.buildDirectory.dir("test-work/${name}/tmp").get().asFile.absolutePath
        environment HOME: homeDirectory, USERPROFILE: homeDirectory,
                TMPDIR: temporaryDirectory, TMP: temporaryDirectory, TEMP: temporaryDirectory
        def quote = { value -> '"' + value.toString().replace('"', '"\'"\'"') + '"' }
        def inherited = environment['JAVA_TOOL_OPTIONS'] ?: ''
        def homeOption = quote('-Duser.home=' + homeDirectory)
        def temporaryOption = quote('-Djava.io.tmpdir=' + temporaryDirectory)
        environment 'JAVA_TOOL_OPTIONS', "${inherited} ${homeOption} ${temporaryOption}".trim()

        // 大类路径仍通过标准 JDK 参数文件传递，避免 Gradle 再次缩短命令。
        def properties = new JsonSlurper().parse(runtimeFile.get().asFile).systemProperties
        def classpaths = properties.findAll { name, value -> name.endsWith('.classpath') }
        systemProperties(properties.findAll { name, value -> !classpaths.containsKey(name) })
        def argumentFile = layout.buildDirectory.file('java-peer-classpaths.args').get().asFile
        def arguments = new TreeMap(classpaths).collect { name, value ->
            '"' + "-D${name}=${value}".replace('\\', '\\\\').replace('"', '\\"') + '"'
        }
        argumentFile.setText(arguments.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        jvmArgs '@' + argumentFile.absolutePath
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
