import groovy.json.JsonOutput
import java.net.URLClassLoader

plugins {
    id 'java'
}

description = 'Meteor applications and JUnit interoperability scenarios'

def meteorTestDirectory = rootProject.file('meteor-test')
def fixtureDirectory = new File(meteorTestDirectory, 'resource')

// 公共契约和证书只进入应用资源；Java 测试 SPI 与类型期望使用标准 test 资源。
sourceSets.main.resources.srcDir(fixtureDirectory)

// WSDL 引用保持在同一资源根，构建时从共享目录补入 XSD。
tasks.named('processResources') {
    from(new File(fixtureDirectory, 'protocol/xsd')) {
        into 'protocol/wsdl'
    }
}

dependencies {
    implementation project(':meteor')
    implementation project(':meteor-test-contracts')
    def applicationModules = [
        'meteor-registry', 'meteor-registry-jdbc', 'meteor-registry-nacos',
        'meteor-registry-zookeeper', 'meteor-registry-dubbo', 'meteor-protocol-grpc',
        'meteor-protocol-hprose', 'meteor-protocol-soap', 'meteor-protocol-jsonrpc',
        'meteor-protocol-xmlrpc', 'meteor-protocol-hessian', 'meteor-protocol-connect',
        'meteor-protocol-triple', 'meteor-protocol-dubbo', 'meteor-protocol-thrift', 'meteor-protocol-oncrpc'
    ]
    applicationModules.each { module -> implementation project(":${module}") }
    implementation "com.h2database:h2:2.3.232"
    // 源码对端的主运行图也用于独立进程，显式提供脚本引擎。
    runtimeOnly "ognl:ognl:${property('lib.ognl')}"
    // 标准 main 中的已签入 Thrift 绑定直接引用日志 API。
    implementation "org.slf4j:slf4j-api:1.7.36"

    // 这些 SDK API 由仍在 JUnit 内执行的原有断言使用；进程对端另有独立运行图。
    testImplementation "io.grpc:grpc-netty-shaded:1.84.1"
    testImplementation "io.grpc:grpc-stub:1.84.1"
    testImplementation "io.grpc:grpc-protobuf:1.84.1"
    testImplementation "io.grpc:grpc-services:1.84.1"
    testImplementation("io.grpc:grpc-interop-testing:1.84.1") {
        exclude group: 'io.opentelemetry', module: 'opentelemetry-exporter-prometheus'
        exclude group: 'dev.cel'
    }
    testImplementation "com.sun.xml.ws:jaxws-rt:4.0.5"
    testImplementation "org.eclipse.angus:angus-mail:2.0.5"
    testImplementation "org.apache.dubbo:dubbo:3.3.6"
    testImplementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"
    testImplementation "org.apache.curator:curator-test:5.2.0"
    testImplementation project(':meteor-test')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

apply from: 'gradle/execution.gradle'

tasks.named('test') {
    workingDir meteorTestDirectory
    maxHeapSize = '1536m'
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    dependsOn ':meteor-test-sdk:exportRuntimes'
    doFirst {
        // 官方 SDK 及其他对端在独立进程运行，继承当前测试的隔离目录。
        def workDirectory = layout.buildDirectory.dir("test-work/${name}").get().asFile
        def userDirectory = new File(workDirectory, 'home').absolutePath
        def temporaryDirectory = new File(workDirectory, 'tmp').absolutePath
        environment HOME: userDirectory, USERPROFILE: userDirectory,
            TMPDIR: temporaryDirectory, TMP: temporaryDirectory, TEMP: temporaryDirectory

        // 嵌套 JVM 保留调用方选项，并支持目录名中的空格与引号。
        def quoteJvmOption = { String option -> '"' + option.replace('"', '"\'"\'"') + '"' }
        def toolOptions = environment['JAVA_TOOL_OPTIONS'] ?: ''
        def homeOption = quoteJvmOption("-Duser.home=${userDirectory}")
        def temporaryOption = quoteJvmOption("-Djava.io.tmpdir=${temporaryDirectory}")
        environment 'JAVA_TOOL_OPTIONS', "${toolOptions} ${homeOption} ${temporaryOption}".trim()

        systemProperties executionProperties()

        // SDK 运行图通过 JDK 参数文件传递，避免长类路径触发 Gradle 二次缩短。
        def classpaths = systemProperties.findAll { name, value ->
            name.toString().toLowerCase(Locale.ROOT).endsWith('classpath')
        }
        def argumentFile = layout.buildDirectory.file('java-peer-classpaths.args').get().asFile
        argumentFile.parentFile.mkdirs()
        def arguments = new TreeMap(classpaths).collect { name, value ->
            def argument = "-D${name}=${value}".replace('\\', '\\\\').replace('"', '\\"')
            '"' + argument + '"'
        }
        argumentFile.setText(arguments.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        setSystemProperties(systemProperties.findAll { name, value -> !classpaths.containsKey(name) })
        def argumentOption = '@' + argumentFile.absolutePath
        setJvmArgs(jvmArgs.findAll { it != argumentOption } + argumentOption)
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('exportExecution') {
    description = 'Compile once and export the JUnit execution inputs for independent jobs.'
    dependsOn tasks.named('testClasses'), ':meteor-test-sdk:exportRuntimes'
    inputs.files(sourceSets.test.runtimeClasspath)
    inputs.files(sourceSets.test.allJava)
    def destination = layout.buildDirectory.file('execution/runtime.json')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        // 源码只确定外层测试入口，方法清单随后从编译结果读取，避免混入嵌套 fixture。
        def classNames = new TreeSet<String>()
        sourceSets.test.allJava.files.sort().each { source ->
            def text = source.getText('UTF-8')
            def packageMatch = text =~ /(?m)^package\s+([\w.]+)\s*;/
            def methodMatches = text =~ /@(?:org\.junit\.)?Test\b(?:\s*\([^)]*\))?\s+[^{};]*?\bvoid\s+(\w+)\s*\(/
            if (methodMatches.find() && packageMatch.find()) {
                def className = packageMatch.group(1) + '.' + source.name.replaceFirst(/\.java$/, '')
                classNames.add(className)
            }
        }
        def classpath = sourceSets.test.runtimeClasspath.files.findAll { it.exists() }
        def urls = classpath.collect { it.toURI().toURL() } as URL[]
        def classMethods = new TreeMap<String, List<String>>()
        new URLClassLoader(urls, ClassLoader.getPlatformClassLoader()).withCloseable { loader ->
            classNames.each { className ->
                // false 禁止类初始化；不创建 JUnit Runner，也不执行参数工厂或任何测试方法。
                def type = Class.forName(className, false, loader)
                classMethods[className] = type.declaredMethods.findAll { method ->
                    method.declaredAnnotations.any { annotation -> annotation.annotationType().name == 'org.junit.Test' }
                }.collect { it.name }.unique().sort()
            }
        }
        def runtime = [
            classpath: classpath.collect { it.absolutePath },
            jvmArguments: tasks.named('test').get().jvmArgs,
            systemProperties: executionProperties(),
            classNames: classNames.toList(),
            classMethods: classMethods,
            sourceRoots: sourceSets.test.java.srcDirs.collect { it.absolutePath },
            workingDirectory: meteorTestDirectory.absolutePath
        ]
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(runtime)) + '\n', 'UTF-8')
    }
}
