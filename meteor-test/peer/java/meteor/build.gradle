plugins {
    id 'java'
}

description = 'Meteor applications and JUnit interoperability scenarios'

def meteorTestDirectory = rootProject.file('meteor-test')
def fixtureDirectory = new File(meteorTestDirectory, 'resource')

// 公共契约和证书只进入应用资源；Java 测试 SPI 与类型期望使用标准 test 资源。
sourceSets.main.resources.srcDir(fixtureDirectory)

// 本工程只声明自己的应用运行图和测试工作目录。
ext.nxnRuntimeProperties = [
        'meteor.test.application.classpath': sourceSets.main.runtimeClasspath,
        'meteor.test.peerDirectory': files(new File(meteorTestDirectory, 'peer')),
        'meteor.test.container.workDirectory': files(layout.buildDirectory.dir('container-scenarios')),
        'limitTime': providers.systemProperty('meteor.test.nacos.limitTime').orElse('1000')
]

// WSDL 引用保持在同一资源根，构建时从共享目录补入 XSD。
tasks.named('processResources') {
    from(new File(fixtureDirectory, 'protocol/xsd')) {
        into 'protocol/wsdl'
    }
}

dependencies {
    implementation project(':meteor')
    implementation project(':meteor-test-contracts')
    def applicationModules = [
            'meteor-registry', 'meteor-registry-jdbc', 'meteor-registry-nacos',
            'meteor-registry-zookeeper', 'meteor-registry-dubbo', 'meteor-protocol-grpc',
            'meteor-protocol-hprose', 'meteor-protocol-soap', 'meteor-protocol-jsonrpc',
            'meteor-protocol-xmlrpc', 'meteor-protocol-hessian', 'meteor-protocol-connect',
            'meteor-protocol-triple', 'meteor-protocol-dubbo', 'meteor-protocol-thrift', 'meteor-protocol-oncrpc'
    ]
    applicationModules.each { module -> implementation project(":${module}") }
    implementation "com.h2database:h2:2.3.232"
    // 源码对端的主运行图也用于独立进程，显式提供脚本引擎。
    runtimeOnly "ognl:ognl:${property('lib.ognl')}"
    // 标准 main 中的已签入 Thrift 绑定直接引用日志 API。
    implementation "org.slf4j:slf4j-api:1.7.36"

    // 这些 SDK API 由仍在 JUnit 内执行的原有断言使用；进程对端另有独立运行图。
    testImplementation "io.grpc:grpc-netty-shaded:1.84.1"
    testImplementation "io.grpc:grpc-stub:1.84.1"
    testImplementation "io.grpc:grpc-protobuf:1.84.1"
    testImplementation "io.grpc:grpc-services:1.84.1"
    testImplementation("io.grpc:grpc-interop-testing:1.84.1") {
        exclude group: 'io.opentelemetry', module: 'opentelemetry-exporter-prometheus'
        exclude group: 'dev.cel'
    }
    testImplementation "com.sun.xml.ws:jaxws-rt:4.0.5"
    testImplementation "org.eclipse.angus:angus-mail:2.0.5"
    testImplementation "org.apache.dubbo:dubbo:3.3.6"
    testImplementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"
    testImplementation "org.apache.curator:curator-test:5.2.0"
    testImplementation project(':meteor-test')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

// 框架对端复用已编译的业务与进程工具，不继承应用工程的完整运行依赖。
tasks.register('frameworkPeerJar', Jar) {
    archiveClassifier = 'framework-peer'
    from sourceSets.main.output
    include 'net/hasor/example/integration/FrameworkOrderServiceImpl.class'
    include 'net/hasor/peer/framework/FrameworkPeerUtils.class'
}

apply from: 'gradle/execution.gradle'
