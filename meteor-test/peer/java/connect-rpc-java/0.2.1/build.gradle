plugins {
    id 'java'
}

description = 'Connect RPC Java 0.2.1 server peer with its own Protobuf runtime'

dependencies {
    // 服务端独占 Protobuf 4 与对应 gRPC 版本，不参与其他 SDK 的 main 编译图。
    compileOnly project(':meteor-test-contracts')
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${property('lib.jackson')}"
    compileOnly "me.ivovk:connect-rpc-java-netty:${property('lib.connect.java')}"
    compileOnly "io.grpc:grpc-protobuf:${property('lib.grpc.connect')}"
    compileOnly "io.grpc:grpc-stub:${property('lib.grpc.connect')}"
    compileOnly "com.google.protobuf:protobuf-java:${property('lib.protobuf.connect')}"
}

tasks.named('compileJava') {
    options.compilerArgs += '-parameters'
}
