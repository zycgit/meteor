plugins {
    id 'java'
}

description = 'Current Connect Kotlin consumer peers with an independent Protobuf runtime'

dependencies {
    // 新版 SDK 的 OkHttp、Kotlin 和 Protobuf 依赖与历史 SDK 编译域隔离。
    compileOnly project(':meteor-test-contracts')
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${property('lib.jackson')}"
    compileOnly "com.connectrpc:connect-kotlin-okhttp:${property('test.sdk.connect.current')}"
    compileOnly "com.connectrpc:connect-kotlin-google-java-ext:${property('test.sdk.connect.current')}"
    compileOnly "com.google.protobuf:protobuf-java:${property('lib.protobuf')}"
}

tasks.named('compileJava') {
    options.compilerArgs += '-parameters'
}
