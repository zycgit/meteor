plugins {
    id 'java-library'
}

ext.pomName = 'Meteor Framework'
description = 'Meteor framework with configuration, context assembly, RPC, service container, addresses, serialization and Neta transports.'

dependencies {
    api "net.hasor:cobble-all:${property('lib.cobble')}"
    api "net.hasor:neta-core:${property('lib.neta')}"
    api "com.fasterxml.jackson.core:jackson-databind:${property('lib.jackson')}"
    api "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${property('lib.jackson')}"

    implementation "ognl:ognl:${property('lib.ognl')}"
    implementation "net.hasor:neta-codec-http:${property('lib.neta')}"

    // for test
    testImplementation "com.google.code.gson:gson:${property('lib.gson')}"
    testImplementation "io.netty:netty-codec-http2:${property('lib.netty')}"
}
