include 'meteor-registry-jdbc'
include 'meteor-registry-nacos'
include 'meteor-registry-zookeeper'
include 'meteor-registry-dubbo'
project(':meteor-registry-jdbc').projectDir = file('meteor-integration/meteor-registry-jdbc')
project(':meteor-registry-nacos').projectDir = file('meteor-integration/meteor-registry-nacos')
project(':meteor-registry-zookeeper').projectDir = file('meteor-integration/meteor-registry-zookeeper')
