pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri('build/maven-repository') }
        mavenLocal()
        mavenCentral()
        ivy {
            // Nacos 单机发行包仅供测试启动独立 Java 进程。
            url = uri('https://github.com/alibaba/nacos/releases/download')
            patternLayout {
                artifact '[revision]/[artifact]-[revision].[ext]'
            }
            metadataSources { artifact() }
            content { includeModule('com.alibaba.nacos', 'nacos-server') }
        }
    }
}

rootProject.name = 'meteor-parent'

//
include 'meteor'
include 'meteor-registry'
include 'meteor-console'

//
include 'meteor-protocol-hprose'
include 'meteor-protocol-grpc'
include 'meteor-protocol-soap'
include 'meteor-protocol-jsonrpc'
include 'meteor-protocol-xmlrpc'
include 'meteor-protocol-hessian'
include 'meteor-protocol-connect'
include 'meteor-protocol-dubbo'
include 'meteor-protocol-thrift'
include 'meteor-protocol-oncrpc'
include 'meteor-protocol-triple'
project(':meteor-protocol-hprose').projectDir = file('meteor-integration/meteor-protocol-hprose')
project(':meteor-protocol-grpc').projectDir = file('meteor-integration/meteor-protocol-grpc')
project(':meteor-protocol-soap').projectDir = file('meteor-integration/meteor-protocol-soap')
project(':meteor-protocol-jsonrpc').projectDir = file('meteor-integration/meteor-protocol-jsonrpc')
project(':meteor-protocol-xmlrpc').projectDir = file('meteor-integration/meteor-protocol-xmlrpc')
project(':meteor-protocol-hessian').projectDir = file('meteor-integration/meteor-protocol-hessian')
project(':meteor-protocol-connect').projectDir = file('meteor-integration/meteor-protocol-connect')
project(':meteor-protocol-dubbo').projectDir = file('meteor-integration/meteor-protocol-dubbo')
project(':meteor-protocol-thrift').projectDir = file('meteor-integration/meteor-protocol-thrift')
project(':meteor-protocol-oncrpc').projectDir = file('meteor-integration/meteor-protocol-oncrpc')
project(':meteor-protocol-triple').projectDir = file('meteor-integration/meteor-protocol-triple')

